# Full stack: PostgreSQL + FastAPI (CP-SAT, pvlib) + the static web build behind nginx.
#   docker compose up --build   →  http://localhost:8080
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sunshift
      POSTGRES_PASSWORD: sunshift
      POSTGRES_DB: sunshift
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunshift"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://sunshift:sunshift@db:5432/sunshift
      CORS_ORIGINS: "*"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"

volumes:
  pgdata:
